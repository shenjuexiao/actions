# .github/workflows/daily-commit.yml
name: daily-commit

on:
  schedule:
    # 每天0点、8点、16点触发
    - cron: '0 0,8,16 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name "shenjuexiao"
          git config --global user.email "60324485+shenjuexiao@users.noreply.github.com"

      - name: Generate random commits
        run: |
          # 生成0-3之间的随机数
          RANDOM_NUM=$(($RANDOM % 4))
          COMMIT_COUNT=$RANDOM_NUM   # 0~3 直接就是提交次数

          CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S')

          # 先执行提交，边提交边把随机内容收集到临时文件
          ACTUAL_COUNT=0
          : > /tmp/commit_lines.txt
          for i in $(seq 1 $COMMIT_COUNT); do
            RANDOM_CONTENT="Random commit #${i} at $(date '+%Y-%m-%d %H:%M:%S') - RANDOM: $(($RANDOM % 10000))"
            echo "- ${RANDOM_CONTENT}" >> /tmp/commit_lines.txt

            git add daily-commit.md 2>/dev/null || true
            # 先把内容追加进文件再提交
            echo "- ${RANDOM_CONTENT}" >> daily-commit.md
            git add daily-commit.md
            git commit -m "Daily commit #${i} - $(date '+%Y-%m-%d %H:%M:%S')"

            ACTUAL_COUNT=$((ACTUAL_COUNT + 1))
          done

          # 统一写入摘要（三级标题一行，上方空一行），再拼接随机内容
          {
            echo ""
            echo "### 🕐 ${CURRENT_TIME} | 随机数: ${RANDOM_NUM} | 计划次数: ${COMMIT_COUNT} | 执行次数: ${ACTUAL_COUNT}"
            cat /tmp/commit_lines.txt
          } >> daily-commit.md

          git add daily-commit.md
          # 若本轮没有提交（ACTUAL_COUNT=0），这里仍会产生一次“汇总”提交；
          # 如需 0 次时完全不提交，可加判断：
          # if [ "$ACTUAL_COUNT" -eq 0 ]; then exit 0; fi
          git commit -m "Daily summary - $(date '+%Y-%m-%d %H:%M:%S')" || echo "nothing to commit"
          git push origin main

      - name: Display result
        run: |
          echo "=== 最新提交记录 ==="
          tail -n 10 daily-commit.md
